# One paper on your own server: `docker compose up -d`, then open port 3000.
# Put HTTPS in front of it; the editor's sign-in needs a secure connection.
services:
  paper:
    build: .
    # Or run a published release instead of building:
    # image: ghcr.io/OWNER/broadsheet:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - paper:/data
    # Optional: the paper's place and time zone (see README).
    # environment:
    #   BROADSHEET_TODAY: '{"location":{"name":"Chicago","latitude":41.88,"longitude":-87.63,"timeZone":"America/Chicago"}}'

volumes:
  paper:
